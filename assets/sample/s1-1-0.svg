<svg xmlns="http://www.w3.org/2000/svg" class="sim-svg map-sim" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><style>.svg-line{stroke:#bcbcbc;stroke-width:2;fill:none}.svg-line.thin{stroke-width:1}.svg-soft{stroke:#666;stroke-width:1.4;fill:none}.svg-fill{fill:#bcbcbc}.svg-route{stroke:#ddd;stroke-width:4;stroke-dasharray:10 15;fill:none}.map-blocks rect,.plaza-zones rect{fill:#202020;stroke:#777;stroke-width:1.5}.graph-line{stroke:#ccc;stroke-width:4;fill:none}.network-candidate{stroke:#777;stroke-width:2;stroke-dasharray:8 9}.network-final{stroke:#ddd;stroke-width:4}.svg-node,.request-node{fill:#bbb}.network-particle{fill:#ddd}.broadcast-waves circle{fill:none;stroke:#aaa;stroke-width:2}.response{fill:#444;stroke:#ccc;stroke-width:2}*{animation:none!important}</style>
